name: RHC Repository Downloads Integrity (nonpublishing)

# Read-only validation of the canonical LBS-style immutable downloads archive.
on:
  pull_request:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'tools/rhc_downloads.py'
      - 'tools/rhc_release_contracts.py'
      - 'tests/test_rhc_downloads_contracts.py'
      - 'config/rhc-release-policy.json'
      - '.github/workflows/rhc-downloads-verify.yml'
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'tools/rhc_downloads.py'
      - 'tools/rhc_release_contracts.py'
      - 'tests/test_rhc_downloads_contracts.py'
      - 'config/rhc-release-policy.json'
      - '.github/workflows/rhc-downloads-verify.yml'
  # GITHUB_TOKEN-created release merges do NOT emit new push workflow runs.
  # Completion of the already-running authorized publisher is an independent
  # GitHub event. Keep this read-only and bound to the original source SHA.
  workflow_run:
    workflows: [RHC Reusable Interim Unsigned Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Optional indexed public version (X.Y.Z.H); blank verifies latest
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rhc-downloads-readonly-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-immutable-downloads:
    name: Validate ZIP manifest and unmodified release history
    # Never run for failed, skipped, fork, pull-request or non-main publishers.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 SHA pinned
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate downloads catalog against actual archive bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/rhc_downloads.py --downloads downloads
          python3 -m unittest discover -s tests -p 'test_rhc_downloads_contracts.py' -v
          python3 -m unittest discover -s tests -p 'test_rhc_remote_binary_verify_contracts.py' -v
          python3 -B tools/rhc_release_contracts.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('config/rhc-release-policy.json').read_text())
          assert p['distribution'] == 'repo-downloads'
          assert p['productionEnabled'] is False
          assert p['signingDecision'] == 'unknown'
          assert p['rollbackVerified'] is False
          print('RHC_DOWNLOADS_NONPUBLISHING_POLICY=PASS')
          PY
          git diff --exit-code
      - name: Bind independent completed publisher to exact original public source
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GITHUB_EVENT: ${{ github.event_name }}
          PUBLISHER_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT" = workflow_run
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,os,re,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from rhc_release_contracts import version_from_model
          source=os.environ['PUBLISHER_SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'untrusted original publisher SHA'
          latest=json.loads(Path('downloads/latest.json').read_text())
          assert latest['sourceSha']==os.environ['PUBLISHER_SOURCE_SHA'], 'publisher source no longer matches current published release'
          assert latest['version']==version_from_model('.'), 'public catalog differs from immutable product version'
          assert latest['tag']=='v'+latest['version'], 'immutable release tag mismatch'
          print('RHC_POSTRELEASE_ORIGINAL_PUBLISHER=PASS source='+source+' publicVersion='+latest['version'])
          PY
      # GitHub chat connectors cannot reliably stream large ZIP binaries.
      # Only verify the actual published main ref, not an unmerged PR checkout.
      # HTTPS request is to immutable commit-addressed raw.githubusercontent.com,
      # with no GitHub token and no repository/file mutation.
      - name: Independently GET immutable published ZIP bytes via HTTPS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          VERIFY_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          args=(--root . --repository "$GITHUB_REPOSITORY" --commit-sha "$GITHUB_SHA")
          if [[ -n "$VERIFY_VERSION" ]]; then
            args+=(--version "$VERIFY_VERSION")
          fi
          python3 -B tools/rhc_remote_binary_verify.py "${args[@]}"
          # Reject a successful result for a checkout superseded during HTTP GET.
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all -- downloads)"
          echo 'RHC_PUBLIC_BINARY_READBACK_SCOPE=READ_ONLY'
      - name: Reject modifications or deletions of already tracked ZIP archives
        shell: bash
        env:
          GITHUB_EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT" = 'pull_request' ]; then
            git fetch --no-tags origin main
            BASE="$(git merge-base origin/main HEAD)"
          elif [ "$GITHUB_EVENT" = 'push' ]; then
            BASE="$BEFORE_SHA"
          else
            echo 'RHC_DOWNLOADS_HISTORY=PASS (manual read-only validation only)'
            exit 0
          fi
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE" =~ ^0{40}$ ]]; then
            echo 'Cannot establish a trustworthy comparison base' >&2
            exit 1
          fi
          while IFS=$'\t' read -r status path; do
            [ -n "$status" ] || continue
            if [ "$status" != A ]; then
              echo "Existing release ZIP changed or was deleted: $status $path" >&2
              exit 1
            fi
          done < <(git diff --name-status "$BASE" HEAD -- 'downloads/*.zip' 'downloads/qa/*.zip')
          echo 'RHC_DOWNLOADS_HISTORY=PASS'
