name: RHC Infrastructure Qualification (nonpublishing)

# All authorized RHC Work-Paths; not Candidate Preflight or a production release.
on:
  push:
    branches:
      - 'work/RHC-*'
    paths:
      - 'model.go'
      - 'CHANGELOG.md'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'docs/RHC_CICD_ARCHITECTURE.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rhc-infrastructure-ci.yml'
      - 'model.go'
      - 'i18n-manifest.json'
      - 'locales/de-DE.json'
      - 'tools/validate_*.py'
      - 'tools/rhc_orchestration_contracts.py'
      - 'tools/rhc_workflow_reliability.py'
      - 'tests/test_rhc_workflow_reliability_contracts.py'
      - '.github/workflows/rhc-reusable-interim-release.yml'
      - '.github/workflows/rhc-candidate-preflight.yml'
      - 'tools/rhc_downloads.py'
      - 'tools/rhc_release_contracts.py'
      - 'tools/rhc_release_dry_run.py'
      - 'tests/test_rhc_*_contracts.py'
      - 'docs/RHC_CICD_ARCHITECTURE.md'
      - '.github/workflows/rhc-development-completion.yml'
      - 'tools/rhc_candidate_from_work.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: rhc-infra-validation-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  linux-golden-package:
    name: rhc/infra/linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 Node 24
        with:
          go-version: '1.23.2'
          cache: false
      - name: RHC-115 canonical Issue readback for Work push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/RHC-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NUMBER="${GITHUB_REF_NAME#work/RHC-}"
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]
          python3 tools/rhc_issue_init.py verify --repository "$GITHUB_REPOSITORY" --issue "$NUMBER"
      - name: Verify strict current 4-part version, archive safety and nonpublishing policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/rhc_downloads.py --downloads downloads
          # Historical 321-file source audit is separately pinned at immutable PR #2 HEAD.
          python3 -B tools/rhc_release_contracts.py --root .
          python3 -m unittest discover -s tests -p 'test_rhc_*_contracts.py' -v
          # Deliberate negative test: unchanged current source is NOT a new Candidate.
          # Distinguish the intended rejection from unrelated tool/build errors.
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from rhc_release_contracts import assert_future_version, version_from_model
          v = version_from_model('.')
          try:
              assert_future_version(v, v)
          except ValueError as exc:
              assert str(exc) == 'candidate must advance beyond main version', str(exc)
          else:
              raise AssertionError('UNSAFE: unchanged version accepted as Candidate')
          print('RHC_UNCHANGED_CANDIDATE_REJECTED=PASS version=' + v)
          PY
      - name: Compile and validate original Go Windows GUI
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          GOFLAGS: '-buildvcs=false'
        run: |
          set -euo pipefail
          bash build.sh "$RUNNER_TEMP/rhc-build1"
          actual="$(sha256sum "$RUNNER_TEMP/rhc-build1/RazerHealthCenter.exe" | cut -d' ' -f1)"
          test -n "$actual" && test "${#actual}" = 64
          echo "RHC_INFRA_CURRENT_EXE=PASS $actual (work SHA $GITHUB_SHA; historical v3.0.8 Golden separately pinned)"
          # Frozen 3.0.8 Golden EXE is verified only by pinned historical intake CI.
          # A second independent clean Windows GUI build must reproduce the
          # current four-component product EXE (not the historical frozen EXE).
          bash build.sh "$RUNNER_TEMP/rhc-build2"
          second="$(sha256sum "$RUNNER_TEMP/rhc-build2/RazerHealthCenter.exe" | cut -d' ' -f1)"
          test "$second" = "$actual" || { echo "RHC_INDEPENDENT_BUILD_MISMATCH: $second"; exit 1; }
          cmp -s "$RUNNER_TEMP/rhc-build1/RazerHealthCenter.exe" "$RUNNER_TEMP/rhc-build2/RazerHealthCenter.exe"
          echo "RHC5_TWO_INDEPENDENT_GO_BUILDS=PASS sha256=$second"
      - name: Deterministically package source/portable twice
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/rhc_release_contracts.py --root . \
            --exe "$RUNNER_TEMP/rhc-build1/RazerHealthCenter.exe" --out "$RUNNER_TEMP/rhc-package1" \
            | sed -E 's/"files": \[[^]]*\]/"files": "(list omitted)"/g'
          python3 -B tools/rhc_release_contracts.py --root . \
            --exe "$RUNNER_TEMP/rhc-build2/RazerHealthCenter.exe" --out "$RUNNER_TEMP/rhc-package2" \
            | sed -E 's/"files": \[[^]]*\]/"files": "(list omitted)"/g'
          VERSION="$(python3 -c 'import sys;sys.path.insert(0,"tools");from rhc_release_contracts import version_from_model;print(version_from_model("."))')"
          test -n "$VERSION"  # exact four-part version already parsed by version_from_model
          for name in "RazerHealthCenter-Source-v${VERSION}.zip" "RazerHealthCenter-Portable-v${VERSION}.zip"; do
            cmp -s "$RUNNER_TEMP/rhc-package1/$name" "$RUNNER_TEMP/rhc-package2/$name" || {
              echo "RHC_PACKAGE_REPRODUCIBILITY_FAIL: $name"; exit 1;
            }
          done
          python3 - "$RUNNER_TEMP/rhc-package1/RazerHealthCenter-Source-v${VERSION}.zip" \
                     "$RUNNER_TEMP/rhc-package1/RazerHealthCenter-Portable-v${VERSION}.zip" <<'PY'
          import zipfile, sys
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert all(not n.endswith(('.zip','.exe','.log')) for n in names)
              assert not any(n.startswith('forensics/') for n in names)
              assert 'go.mod' in names and 'tools/rhc_release_contracts.py' in names
          with zipfile.ZipFile(sys.argv[2]) as z:
              assert len([n for n in z.namelist() if n.endswith('/')])==12
              assert len([n for n in z.namelist() if not n.endswith('/')])==7
              assert z.testzip() is None
          print('RHC_INFRA_PACKAGE_INTEGRITY=PASS')
          PY
          echo 'RHC_INFRA_PACKAGES_REPRODUCIBLE=PASS'
      # RHC-76: real Node24 artifact transfer from Linux to hosted Windows.
      - name: Create exact-SHA Node24 artifact transport proof
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/rhc76-action-proof.txt"
          test "$(cat "$RUNNER_TEMP/rhc76-action-proof.txt")" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: rhc76-node24-proof-${{ github.sha }}
          path: ${{ runner.temp }}/rhc76-action-proof.txt
          retention-days: 1
          if-no-files-found: error


  windows-native-safety:
    name: rhc/infra/windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 Node 24
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify source hashes and package contracts natively
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/rhc_downloads.py --downloads downloads
          if ($LASTEXITCODE -ne 0) { throw 'Original TEST archive/official index validation failed on Windows' }
          python -B tools/rhc_release_contracts.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Current four-part product version invalid on Windows' }
          python -m unittest discover -s tests -p test_rhc_*_contracts.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Release contract tests failed on Windows' }
      - name: Actual PowerShell 5.1 parser and read-only safety tests
        shell: powershell
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          GOFLAGS: '-buildvcs=false'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
              throw 'Native Windows PowerShell 5.1 required'
          }
          $files = @(Get-ChildItem -File -Recurse -Filter '*.ps1')
          if ($files.Count -lt 15) { throw 'PowerShell script inventory unexpectedly smaller than 15' }
          foreach ($f in $files) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$tokens,[ref]$errors)
              if ($errors.Count -gt 0) { throw "PS parse failure in $($f.FullName)" }
          }
          Write-Output "RHC_INFRA_PS51_PARSER=PASS files=$($files.Count)"
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go native test failure' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go native vet failure' }
          python -B tools/validate_v307_ps51_appengine_diagnostic.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic source checks failed' }
          python -B tools/validate_v306_appengine_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'Recovery checks failed' }
          python -B tools/validate_repair_safety.py
          if ($LASTEXITCODE -ne 0) { throw 'Repair safety checks failed' }
          Write-Output 'RHC_INFRA_WINDOWS=PASS'

  node24-cross-os-artifact:
    name: rhc/infra/artifact-node24
    needs: [linux-golden-package]
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, node24
        with:
          name: rhc76-node24-proof-${{ github.sha }}
          path: ${{ runner.temp }}/rhc76-node24
      - name: Verify real Linux-to-Windows downloaded artifact
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'rhc76-node24/rhc76-action-proof.txt'
          if (!(Test-Path -LiteralPath $p)) { throw 'Node24 transfer artifact missing' }
          $actual=(Get-Content -LiteralPath $p -Raw).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'Node24 artifact SHA identity mismatch' }
          Write-Output "RHC76_NODE24_LINUX_WINDOWS_ARTIFACT=PASS sha=$actual"
