name: RHC-29 Phase A QA Evidence (TEST ONLY; no Phase B)
on:
  push:
    branches:
      - main
      - 'work/RHC-29'
    paths:
      - 'model.go'
      - 'tools/rhc_phase_a_qa.py'
      - 'tools/rhc_downloads.py'
      - '.github/workflows/rhc-phase-a-qa.yml'
      - 'tests/test_rhc_phase_a_qa_contracts.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rhc-phase-a-qa.yml'
      - 'tools/rhc_phase_a_qa.py'
      - 'tests/test_rhc_phase_a_qa_contracts.py'
      - 'docs/RHC22_PHASE_A.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rhc-phase-a-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  linux:
    name: Independent PE/QA ZIP and negative/positive evidence contracts
    if: github.repository == 'SaschaP1980/RazerHealthCenter'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOPROXY: off
      GOSUMDB: off
      GOTOOLCHAIN: local
      GOFLAGS: '-buildvcs=false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.2'
          cache: false
      - name: Check exact checkout, immutable release index and Phase B still blocked
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m unittest discover -s tests -p 'test_rhc_phase_a_qa_contracts.py' -v
          python3 -B tools/rhc_downloads.py --downloads downloads
          python3 - <<'PY'
          import json,os,pathlib,sys
          p=json.loads(pathlib.Path("config/rhc-release-policy.json").read_text())
          assert p["productionEnabled"] is False
          assert p["rollbackVerified"] is False
          assert p["signingDecision"] == "unknown"
          assert p["distribution"] == "repo-downloads"
          sys.path.insert(0, "tools")
          from rhc_phase_a_qa import inventory
          # Record every published/QA download byte outside the checkout.
          baseline = inventory("downloads")
          snapshot = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rhc29-downloads-before.json"
          snapshot.write_text(json.dumps(baseline, sort_keys=True), encoding="utf-8")
          print("RHC29_LIVE_RELEASE_BASELINE=PASS files=" + str(len(baseline)))
          print("RHC29_PHASE_B_BLOCKED=PASS; NEVER released")
          PY
      - name: Produce two real identical Windows GUI builds and test-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh "$RUNNER_TEMP/phase-a-build1"
          bash build.sh "$RUNNER_TEMP/phase-a-build2"
          cmp "$RUNNER_TEMP/phase-a-build1/RazerHealthCenter.exe" "$RUNNER_TEMP/phase-a-build2/RazerHealthCenter.exe"
          python3 -B tools/rhc_phase_a_qa.py stage \
            --root . --source-sha "$SOURCE_SHA" \
            --exe-a "$RUNNER_TEMP/phase-a-build1/RazerHealthCenter.exe" \
            --exe-b "$RUNNER_TEMP/phase-a-build2/RazerHealthCenter.exe" \
            --stage "$RUNNER_TEMP/rhc-phase-a-stage"
          python3 -B tools/rhc_phase_a_qa.py verify \
            --root . --source-sha "$SOURCE_SHA" \
            --stage "$RUNNER_TEMP/rhc-phase-a-stage"
          python3 -B tools/rhc_downloads.py --downloads downloads
          python3 - <<'PY'
          import json,os,pathlib,sys
          sys.path.insert(0, "tools")
          from rhc_phase_a_qa import inventory
          snapshot = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rhc29-downloads-before.json"
          before = json.loads(snapshot.read_text(encoding="utf-8"))
          assert inventory("downloads") == before, "repository downloads mutated during Phase-A"
          print("RHC29_PUBLISHED_DOWNLOADS_UNCHANGED=PASS files=" + str(len(before)))
          PY
          test -z "$(git status --porcelain --untracked-files=all -- downloads)"
          echo 'RHC29_LINUX_QA_STAGE=PASS_NONPUBLISHING_ONLY'
      - name: Transfer INTERNAL unapproved QA candidate to native Windows job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RHC29-INTERNAL-NOT-RELEASE-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rhc-phase-a-stage/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Native Windows PS5.1, repair-safety and actual unsigned EXE inspection
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOPROXY: off
      GOSUMDB: off
      GOTOOLCHAIN: local
      GOFLAGS: '-buildvcs=false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: RHC29-INTERNAL-NOT-RELEASE-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rhc-phase-a-stage
      - name: Native Windows PowerShell 5.1 safety and the EXACT Linux-built QA PE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Actual PS5.1 required' }
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Source SHA drift' }
          python -m unittest discover -s tests -p test_rhc_phase_a_qa_contracts.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Phase-A contract tests failed' }
          python -B tools/rhc_phase_a_qa.py verify --root . --stage "$env:RUNNER_TEMP/rhc-phase-a-stage" --source-sha "$env:SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Exact Linux QA ZIP or manifest invalid' }
          $scripts=@(Get-ChildItem -File -Recurse -Filter '*.ps1')
          if ($scripts.Count -lt 15) { throw 'Incomplete read-only Razer PowerShell inventory' }
          foreach ($file in $scripts) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw "PS5.1 parse error $($file.FullName)" }
          }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go native tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go native vet failed' }
          python -B tools/validate_repair_safety.py
          if ($LASTEXITCODE -ne 0) { throw 'Razer repair-safety violation' }
          python -B tools/validate_v307_ps51_appengine_diagnostic.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics regression' }
          python -B tools/validate_v306_appengine_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'Recovery regression' }
          $stage=Join-Path $env:RUNNER_TEMP 'rhc-phase-a-stage'
          $info=Get-Content (Join-Path $stage 'qa-evidence.json') -Raw | ConvertFrom-Json
          if ($info.classification -ne 'TEST_ONLY_NOT_RELEASE' -or $info.phaseB.status -ne 'DISABLED') { throw 'Not an isolated QA build' }
          $archive=Join-Path $stage $info.archive.file
          $extracted=Join-Path $env:RUNNER_TEMP 'rhc-phase-a-extracted'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          $signature=Get-AuthenticodeSignature (Join-Path $extracted 'RazerHealthCenter.exe')
          if ($signature.Status -ne 'NotSigned') { throw 'TEST-UNSIGNED label disagrees with actual Authenticode state' }
          Write-Output "RHC29_HOSTED_WINDOWS=PASS PS5.1; PE Authenticode NotSigned; hardware and owner approval NOT TESTED"

  qualified-test-artifact:
    name: Upload TEST-ONLY artifact after Linux and native Windows PASS
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: RHC29-INTERNAL-NOT-RELEASE-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rhc-phase-a-stage
      - name: Independent final readback; Phase B explicitly remains disabled
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -B tools/rhc_phase_a_qa.py verify \
            --root . --source-sha "$SOURCE_SHA" \
            --stage "$RUNNER_TEMP/rhc-phase-a-stage"
          python3 -B tools/rhc_downloads.py --downloads downloads
          # Fresh exact-SHA checkout; QA evidence must not enter tracked or
          # untracked repo downloads. Internal ZIP lives only in runner temp.
          test -z "$(git status --porcelain --untracked-files=all -- downloads)"
          echo 'RHC29_FINAL_REPO_DOWNLOADS=UNCHANGED'
          echo 'RHC29_QA_ARTIFACT=TECHNICALLY_TESTED_NOT_PRODUCTION_APPROVED'
      - name: Upload ephemeral TEST/UNSIGNED QA evidence, never repository downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RHC29-TEST-UNSIGNED-NOT-RELEASE-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rhc-phase-a-stage/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
