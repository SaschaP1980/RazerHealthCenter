name: RHC v3.0.8 Source Intake (PR validation; no release)

# Immutable historical 3.0.8 Golden intake gate; two jobs always checkout the
# original import Work SHA, while current HEAD 3.0.8.0 is validated by infrastructure CI.
# This is NOT a current-head source manifest check and NOT production CI/CD.
# Pull requests run against the exact proposed merge tree; absent source fails closed.
on:
  workflow_dispatch:
  push:
    branches:
      - import/RHC-1-v3.0.8
    paths:
      - '.gitattributes'
      - '.github/workflows/rhc-source-intake.yml'
      - 'docs/migration/RHC-v3.0.8-source-file-manifest.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rhc-source-intake.yml'
      - 'tools/verify_source_intake.py'
      - 'tools/import_source_archive.py'
      - 'docs/migration/RHC-v3.0.8-source-file-manifest.json'
      - 'go.mod'
      - 'tools/rhc_release_contracts.py'  # historical audit also runs when version contracts evolve
      - 'build.sh'
      - '**/*.go'
      # Root model.go HOTFIX updates are not a historical import change.
      - '!model.go'
      - '**/*.ps1'
      - 'resources/**'
      - 'assets/**'
      - 'diagnostics/**'
      - 'repair/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  linux-golden-source-intake:
    name: Linux build and golden v3.0.8 EXE verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          ref: 2a28a08ba75ecb404df03847cdf1e5eaba941acd # frozen original 321-file source for v3.0.8
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (Node 24)
        with:
          go-version: '1.23.2'
          cache: false
      - name: Require complete source
        shell: bash
        run: |
          set -euo pipefail
          for p in go.mod model.go build.sh tools/patch_rsrc.py tools/validate_pe.py resources/app_rsrc.bin resources/app_rsrc.json; do
            test -f "$p" || { echo "SOURCE_INTAKE_BLOCKED: missing $p"; exit 1; }
          done
          grep -Fq 'appVersion                   = "3.0.8"' model.go
          grep -Fq 'referenceVersion             = "3.0.8"' model.go
      - name: Verify exact imported v3.0.8 source manifest
        shell: bash
        run: python3 -B tools/verify_source_intake.py --root .
      - name: Run original full build without fetching modules
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          GOFLAGS: '-buildvcs=false' # archive reference was produced without Git revision metadata
        run: |
          set -euo pipefail
          bash build.sh "$RUNNER_TEMP/rhc-intake-dist"
          expected='6b48359e6388ee20a0b4974ce1c75ba7c2cd537dc58512e62ed9e6d263529f0a'
          actual="$(sha256sum "$RUNNER_TEMP/rhc-intake-dist/RazerHealthCenter.exe" | cut -d' ' -f1)"
          test "$actual" = "$expected" || { echo "EXE_GOLDEN_MISMATCH: $actual != $expected"; exit 1; }
          echo "RHC_SOURCE_INTAKE_LINUX=PASS sha256=$actual"

  windows-powershell51-safety:
    name: Hosted Windows native PowerShell 5.1 and Go tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          ref: 2a28a08ba75ecb404df03847cdf1e5eaba941acd # frozen original 321-file source for v3.0.8
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (Node 24)
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify imported source identity on Windows
        shell: powershell
        run: |
          python -B tools/verify_source_intake.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'RHC exact source identity FAILED' }
      - name: Parse PowerShell sources on actual Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
              throw "Windows PowerShell 5.1 required; found $($PSVersionTable.PSVersion)"
          }
          if (-not (Test-Path 'go.mod') -or -not (Test-Path 'model.go')) {
              throw 'SOURCE_INTAKE_BLOCKED: source was not imported'
          }
          $files = @(Get-ChildItem -Path . -File -Recurse -Filter '*.ps1')
          if ($files.Count -eq 0) { throw 'SOURCE_INTAKE_BLOCKED: no PowerShell diagnostic/repair sources found' }
          $errors = @()
          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) { $errors += "$($file.FullName): $($parseErrors.Count) parser errors" }
          }
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }
          Write-Output "RHC_SOURCE_INTAKE_PS51_PARSER=PASS files=$($files.Count)"
      - name: Execute Go native Windows checks
        shell: powershell
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go vet failed' }
          python -B tools/validate_v307_ps51_appengine_diagnostic.py
          if ($LASTEXITCODE -ne 0) { throw 'PS5.1 diagnostic source validator failed' }
          python -B tools/validate_v306_appengine_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'AppEngine recovery validator failed' }
          python -B tools/validate_repair_safety.py
          if ($LASTEXITCODE -ne 0) { throw 'Repair safety validator failed' }
          Write-Output 'RHC_SOURCE_INTAKE_WINDOWS=PASS'
