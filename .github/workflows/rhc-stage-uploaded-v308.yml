name: RHC one-time source staging (never publishes)

# One-shot bridge from the already-owner-uploaded v3.0.8 archive on main
# into the existing RHC-1 Draft PR branch. Not a product CI/release workflow.
on:
  push:
    branches:
      - import/RHC-1-v3.0.8
    paths:
      - '.github/workflows/rhc-stage-uploaded-v308.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rhc-source-import-v308-singleton
  cancel-in-progress: false

jobs:
  stage-reviewed-source:
    name: Verify 321 files and push only the source-import branch
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    if: ${{ github.ref == 'refs/heads/import/RHC-1-v3.0.8' }}
    steps:
      - name: Checkout exact import branch (no persistent credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node 24
        with:
          ref: import/RHC-1-v3.0.8
          fetch-depth: 0
          persist-credentials: false

      - name: Require owner-uploaded archive at pinned main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "import/RHC-1-v3.0.8"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          uploaded_main='f789132d31bb7e96b4fdca5d4ed0510fdbc2a3c7'
          test "$(git rev-parse origin/main)" = "$uploaded_main" || {
            echo "SOURCE_STAGE_BLOCKED: main changed; reconcile before staging"; exit 1;
          }
          git show "$uploaded_main:Razer-Synapse-Chroma-Health-Center-Source-v3.0.8.zip" > "$RUNNER_TEMP/rhc-v308-original.zip"
          git show "$uploaded_main:RHC-v3.0.8-original-source-manifest.json" > "$RUNNER_TEMP/rhc-original-inventory.json"
          expected='f2f973acf587b4334f6b90b4418a0d953641fb706188bd354e0577a97a86d495'
          actual="$(sha256sum "$RUNNER_TEMP/rhc-v308-original.zip" | cut -d' ' -f1)"
          test "$actual" = "$expected" || {
            echo "SOURCE_STAGE_BLOCKED: upload ZIP checksum mismatch"; exit 1;
          }
          echo "RHC_OWNER_UPLOADED_ARCHIVE=PASS sha256=$actual"

      - name: Cross-check all 321 bytes against owner-uploaded original manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/rhc-v308-original.zip" "$RUNNER_TEMP/rhc-original-inventory.json" <<'PY'
          import sys,json,zipfile,hashlib
          from pathlib import PurePosixPath
          zpath, mpath = sys.argv[1:]
          m=json.load(open(mpath,encoding='utf-8'))
          assert m.get('sourceZipSha256') == 'f2f973acf587b4334f6b90b4418a0d953641fb706188bd354e0577a97a86d495'
          assert m.get('fileCount') == 321 and len(m['files']) == 321
          indexed={r['path']: r for r in m['files']}
          assert len(indexed) == 321
          fingerprints=[]
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              files=[f for f in z.infolist() if not f.is_dir()]
              assert len(files) == 321
              observed=set()
              for info in files:
                  name=info.filename
                  path=PurePosixPath(name)
                  assert name in indexed and name not in observed
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
                  assert ((info.external_attr >> 16)&0o170000) in (0,0o100000)
                  observed.add(name)
                  raw=z.read(info)
                  rec=indexed[name]
                  sha=hashlib.sha256(raw).hexdigest()
                  assert len(raw)==rec['size'] and sha==rec['sha256']
                  fingerprints.append(f"{name}\0{len(raw)}\0{sha}\n")
              assert observed==set(indexed)
          fingerprint=hashlib.sha256(''.join(sorted(fingerprints)).encode()).hexdigest()
          assert fingerprint=='adbfc9de536bd0ca8a1b69163ffdf080fe0b46b083b42ca498b8fafeb18703db'
          print(f"RHC_UPLOADED_INVENTORY=PASS files=321 fingerprint={fingerprint}")
          PY

      - name: Reconcile owner's latest main into existing import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = 'tools/verify_source_intake.py' || {
              echo "SOURCE_STAGE_BLOCKED: unexpected merge conflict"; echo "$conflicts"; exit 1;
            }
            git checkout --ours -- tools/verify_source_intake.py
            git add tools/verify_source_intake.py
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          git commit -m 'migration: reconcile owner-uploaded canonical v3.0.8 archive' ||
          {
            echo "SOURCE_STAGE_BLOCKED: main reconcile commit not created"; exit 1;
          }
          test -z "$(git status --porcelain)"
          echo "RHC_MAIN_RECONCILED=PASS"

      - name: Byte-preserving original-source import (no product mutation)
        shell: bash
        run: |
          set -euo pipefail
          branch_head="$(git rev-parse HEAD)"
          python3 -B tools/import_source_archive.py \
            --repo . \
            --archive "$RUNNER_TEMP/rhc-v308-original.zip" \
            --expected-archive-sha256 f2f973acf587b4334f6b90b4418a0d953641fb706188bd354e0577a97a86d495 \
            --expected-file-count 321 \
            --expected-branch import/RHC-1-v3.0.8 \
            --expected-head "$branch_head" \
            --replace-bootstrap-readme
          python3 -B tools/import_source_archive.py \
            --repo . \
            --archive "$RUNNER_TEMP/rhc-v308-original.zip" \
            --expected-archive-sha256 f2f973acf587b4334f6b90b4418a0d953641fb706188bd354e0577a97a86d495 \
            --expected-file-count 321 \
            --expected-branch import/RHC-1-v3.0.8 \
            --expected-head "$branch_head" \
            --replace-bootstrap-readme \
            --apply --public-source-reviewed
          python3 -B tools/verify_source_intake.py --root .
          git add -A
          actual="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          test "$actual" -eq 322 || { echo "SOURCE_STAGE_BLOCKED: expected 322 imported changes, got $actual"; exit 1; }
          git diff --cached --name-status | tail -10
          git commit -m 'migration: import 321 exact canonical v3.0.8 source files and hash manifest'
          echo "RHC_GIT_SOURCE_STAGE=PASS changed_paths=$actual"

      - name: Push only source-import branch (no tags/main/releases)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/import/RHC-1-v3.0.8 | cut -f1)"
          test "$remote" = 'f9f5afd5988d451a42419f8ff2b5d2df10c540b1' || {
            echo "SOURCE_STAGE_BLOCKED: import branch moved"; exit 1;
          }
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:refs/heads/import/RHC-1-v3.0.8
          echo "RHC_SOURCE_BRANCH_PUSH=PASS head=$(git rev-parse HEAD)"

      - name: Explicitly dispatch non-publishing Linux and Windows qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/rhc-source-intake.yml/dispatches" \
            -f ref=import/RHC-1-v3.0.8
          echo "RHC_HOSTED_INTAKE_DISPATCH=PASS (qualification outcome pending)"
