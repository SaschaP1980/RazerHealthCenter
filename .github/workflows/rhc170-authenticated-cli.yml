name: RHC-170 Authenticated CLI Benchmark (opt-in, nonpublishing)

# Push on THIS integration Work branch is a read-only credential/CLI smoke only.
# Real version-only --apply --push is manual, fail-closed, and requires a
# separately configured GitHub App token, never the workflow GITHUB_TOKEN.
on:
  push:
    branches:
      - 'work/RHC-174'
    paths:
      - '.github/workflows/rhc170-authenticated-cli.yml'
      - 'tests/test_rhc170_authenticated_runner.py'
  workflow_dispatch:
    inputs:
      mode:
        description: "Probe is read-only; execute is a real App-authenticated CLI version-only Work commit"
        type: choice
        options:
          - probe
          - execute
        default: probe
        required: true
      issue:
        description: "Existing, canonical issue number for a SEPARATE owner-approved version-only HOTFIX"
        type: string
        required: false
      comment_id:
        description: "Verified original 13-heading pre-branch Rolling Comment ID"
        type: string
        required: false
      base_main_sha:
        description: "Frozen exact main SHA (40 hex)"
        type: string
        required: false
      branch_created_at:
        description: "Actual UTC ISO observation of work/RHC-N branch creation"
        type: string
        required: false
      allow_apply_push:
        description: "Explicitly authorize one safeguarded local CLI commit and App-token Work push"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: rhc170-cli-${{ github.ref }}-${{ inputs.issue || 'read-only-probe' }}
  cancel-in-progress: false

jobs:
  authenticated-cli-probe:
    name: Read-only true runner checkout, gh API and RHC170 CLI smoke
    if: github.event_name == 'push' || inputs.mode == 'probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run focused workflow boundary tests
        run: python3 -B -m unittest discover -s tests -p 'test_rhc170_authenticated_runner.py' -v
      - name: Prove actual Git checkout and GH CLI authentication (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SaschaP1980/RazerHealthCenter'
          command -v gh
          command -v git
          git --version
          gh --version | head -n 1
          test -n "$(git rev-parse HEAD)"
          gh api -X GET "repos/$GITHUB_REPOSITORY" --jq '.full_name' | grep -Fx "$GITHUB_REPOSITORY"
          gh api -X GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha' | grep -E '^[0-9a-f]{40}$'
          python3 -B tools/rhc170_atomic_work_pipeline.py --help >/dev/null
          echo 'RHC170_AUTHENTICATED_CLI_PROBE=PASS real_checkout=true gh_api_get=true mode=READ_ONLY push=false'
  authenticated-work-execute:
    name: Execute exact RHC170 CLI --apply --push ONLY with independent App token
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'execute' && inputs.allow_apply_push == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: rhc170-benchmark
    steps:
      - name: Confirm independent App identity configuration before access
        shell: bash
        env:
          RHC170_APP_ID: ${{ vars.RHC170_APP_ID }}
          RHC170_HAS_PRIVATE_KEY: ${{ secrets.RHC170_APP_PRIVATE_KEY != '' }}
          NUMBER: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.comment_id }}
          PIN: ${{ inputs.base_main_sha }}
          BRANCH_OBSERVED: ${{ inputs.branch_created_at }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SaschaP1980/RazerHealthCenter'
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BRANCH_OBSERVED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]{1,6})?Z$ ]]
          [[ "$RHC170_APP_ID" =~ ^[0-9]+$ ]]
          test "$RHC170_HAS_PRIVATE_KEY" = true
          echo 'RHC170_INDEPENDENT_APP_CONFIG=PASS (no token values printed)'
      - name: Generate a short-lived installation token NOT github.token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.RHC170_APP_ID }}
          private-key: ${{ secrets.RHC170_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: read
          permission-actions: read
      - name: Checkout immutable original main with App push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_main_sha }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app.outputs.token }}
      - name: Run REAL atomic RHC170 local Git commit, App-backed push and readback
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.comment_id }}
          PIN: ${{ inputs.base_main_sha }}
          BRANCH_OBSERVED: ${{ inputs.branch_created_at }}
        run: |
          set -euo pipefail
          git config user.name 'rhc170-benchmark[bot]'
          git config user.email 'rhc170-benchmark[bot]@users.noreply.github.com'
          git fetch --no-tags origin "refs/heads/work/RHC-${NUMBER}:refs/remotes/origin/work/RHC-${NUMBER}"
          test "$(git rev-parse HEAD)" = "$PIN"
          test "$(git rev-parse "origin/work/RHC-${NUMBER}")" = "$PIN"
          test -z "$(git status --porcelain)"
          git switch -c "work/RHC-${NUMBER}" "origin/work/RHC-${NUMBER}"
          # This is the repository CLI under test: NO ChatGPT connector surrogate.
          python3 -B tools/rhc170_atomic_work_pipeline.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue "$NUMBER" --comment-id "$COMMENT_ID" \
            --base-main-sha "$PIN" --branch-created-at "$BRANCH_OBSERVED" \
            --root . --apply --push --owner-authorized-new-version \
            | tee "$RUNNER_TEMP/rhc170-real-cli.jsonl"
          python3 - "$RUNNER_TEMP/rhc170-real-cli.jsonl" "$RUNNER_TEMP/rhc170-work.json" <<'PY'
          import json, pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          items = [json.loads(x.split("=", 1)[1]) for x in lines if x.startswith("RHC170_ATOMIC_WORK=")]
          assert len(items) == 1 and items[0]["status"] == "WORK_PUSH_VERIFIED"
          assert items[0]["mutations"] == 2 and items[0]["allowed_paths"] == ["CHANGELOG.md", "model.go"]
          pathlib.Path(sys.argv[2]).write_text(json.dumps(items[0], sort_keys=True))
          print("RHC170_TRUE_CLI_PUSH=PASS workSha=" + items[0]["work_sha"])
          PY
      - name: Observe actual independent PUSH Work-CI creations, never fabricate GREEN
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          read -r SOURCE_SHA PREPUSH_UTC < <(python3 - "$RUNNER_TEMP/rhc170-work.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          t=[e['observed_utc'] for e in d['timings'] if e['event']=='prepush_exact_ref_lease_verified']
          assert len(t)==1
          print(d['work_sha'],t[0])
          PY
          )
          for attempt in $(seq 1 15); do
            if python3 -B tools/rhc170_atomic_work_pipeline.py \
                 --repository "$GITHUB_REPOSITORY" \
                 --observe-ci-for-sha "$SOURCE_SHA" --push-observed-utc "$PREPUSH_UTC"; then
              echo "RHC170_REAL_PUSH_WORK_CI=CREATED_NOT_GREEN sha=$SOURCE_SHA"
              exit 0
            fi
            sleep 4
          done
          echo 'RHC170_REAL_PUSH_WORK_CI=NOT_VERIFIED (never GREEN)' >&2
          exit 1
